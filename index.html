<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LukeZyster.github.io</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-alt: #0d1117;
        --text: #c9d1d9;
        --muted: #8b949e;
        --heading: #f0f6fc;
        --border: #30363d;
        --link: #58a6ff;
        --accent: #238636;
        --table-header: #161b22;
        --code-bg: rgba(110, 118, 129, 0.4);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .page {
        max-width: 980px;
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 96px;
        min-height: 100vh;
      }

      .markdown-body {
        font-size: 16px;
        line-height: 1.6;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin-top: 24px;
        margin-bottom: 16px;
        color: var(--heading);
        font-weight: 600;
        line-height: 1.25;
      }

      .markdown-body h1 {
        padding-bottom: 0.3em;
        font-size: 2em;
        border-bottom: 1px solid var(--border);
      }

      .markdown-body h2 {
        padding-bottom: 0.3em;
        font-size: 1.5em;
        border-bottom: 1px solid var(--border);
      }

      .markdown-body p,
      .markdown-body li,
      .markdown-body td,
      .markdown-body th,
      .markdown-body blockquote {
        color: var(--text);
      }

      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body table,
      .markdown-body blockquote,
      .markdown-body pre,
      .markdown-body hr {
        margin-top: 0;
        margin-bottom: 16px;
      }

      .markdown-body a {
        color: var(--link);
        text-decoration: none;
      }

      .markdown-body a:hover {
        text-decoration: underline;
      }

      .markdown-body strong {
        color: var(--heading);
      }

      .markdown-body ul,
      .markdown-body ol {
        padding-left: 2em;
      }

      .markdown-body li + li {
        margin-top: 4px;
      }

      .markdown-body table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
        border-spacing: 0;
        border-collapse: collapse;
        border: 1px solid var(--border);
      }

      .markdown-body th,
      .markdown-body td {
        padding: 6px 13px;
        border: 1px solid var(--border);
      }

      .markdown-body th {
        background: var(--table-header);
        font-weight: 600;
      }

      .markdown-body code {
        padding: 0.2em 0.4em;
        background: var(--code-bg);
        border-radius: 6px;
        font-size: 85%;
      }

      .markdown-body pre {
        padding: 16px;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .markdown-body pre code {
        background: transparent;
        padding: 0;
      }

      .markdown-body blockquote {
        margin-left: 0;
        padding: 0 1em;
        border-left: 0.25em solid var(--border);
      }

      .markdown-body hr {
        height: 0.25em;
        padding: 0;
        background-color: var(--border);
        border: 0;
      }

      .markdown-body video {
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .loading {
        color: var(--muted);
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article id="content" class="markdown-body">
        <div class="loading">Loading README content...</div>
      </article>
    </main>

    <script>
      async function loadReadme() {
        try {
          const response = await fetch('https://raw.githubusercontent.com/LukeZyster/LukeZyster.github.io/main/README.md', { cache: 'no-store' });
          if (!response.ok) throw new Error('Failed to fetch README');
          const markdown = await response.text();
          const renderer = new marked.Renderer();

          // Preserve raw HTML from README (like <br>, <video>, etc.)
          marked.setOptions({
            breaks: false,
            gfm: true,
            sanitizer: false,
            renderer
          });

          document.getElementById('content').innerHTML = marked.parse(markdown);
        } catch (error) {
          document.getElementById('content').innerHTML = '<p>Unable to load README content. Please check the repository.</p>';
        }
      }

      loadReadme();
    </script>
  </body>
</html>
